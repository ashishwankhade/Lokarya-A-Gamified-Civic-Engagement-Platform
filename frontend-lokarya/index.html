<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <!-- Step 1: Preconnect for speed -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Step 2: Load both fonts in ONE request -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=DM+Sans:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Lokarya</title>
    <meta
      name="description"
      content="A gamified civic engagement platform for urban complaint management, community missions & AI-powered civic intelligence. Earn XP for making your city better."
    />
    <meta name="author" content="Lokarya" />

    <!-- Open Graph / WhatsApp Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lokarya.vercel.app/" />
    <meta property="og:site_name" content="Lokarya" />
    <meta property="og:title" content="🏛️ Lokarya — Work of the People" />
    <meta
      property="og:description"
      content="File complaints, join community missions, earn XP & discover government schemes — all in one civic platform powered by AI."
    />
    <meta
      property="og:image"
      content="https://lokarya.vercel.app/og-preview.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Lokarya — Gamified Civic Engagement Platform"
    />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="🏛️ Lokarya — Work of the People" />
    <meta
      name="twitter:description"
      content="File complaints, join community missions, earn XP & discover government schemes — all in one civic platform powered by AI."
    />
    <meta
      name="twitter:image"
      content="https://lokarya.vercel.app/og-preview.jpg"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
